[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-call-graph-gif"
version = "0.0.2"
description = "Turn a git repository's history into an animated road map of its call network (GIF, MP4 and a self-hosted interactive page), powered by GitGalaxy."
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Topic :: Software Development :: Version Control :: Git"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.5", "pillow>=9.0"]

[project.optional-dependencies]
engine = ["gitgalaxy"]
dev = ["pytest"]

[project.scripts]
historical-call-graph-gif = "historical_call_graph_gif.cli:main"
hcg-gif = "historical_call_graph_gif.cli:main"

[tool.setuptools.packages.find]
include = ["historical_call_graph_gif*"]

[tool.setuptools.package-data]
historical_call_graph_gif = ["web/*"]
