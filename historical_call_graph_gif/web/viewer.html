<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__: roads</title>
<style>
:root{--bg:#0b0f17;--panel:#121826;--line:#243049;--fg:#e6ebf5;--dim:#9aa6bf;--lime:#d2f56a;--teal:#38d6a4;--blue:#3b86f0;--amber:#ffb000;--hi:#ffe9a8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#top{position:absolute;left:0;right:0;top:0;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:linear-gradient(var(--bg) 70%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
h1{font-size:19px;margin:0;font-weight:700}
#when{font-size:16px;color:#c4cde0;min-width:7em}
button,select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:#3b4c70}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue)}
#play{min-width:5.2em;font-weight:600}
#slider{flex:1 1 220px;min-width:160px;accent-color:var(--teal)}
label.tg{display:flex;gap:5px;align-items:center;color:var(--dim);cursor:pointer}
#q{width:11em}
#legend{position:absolute;left:14px;top:62px;font-size:12px;color:var(--dim);background:rgba(18,24,38,.82);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.6}
#grad{display:block;width:130px;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--lime),var(--teal),var(--blue));margin:2px 0 1px}
#grad+div{display:flex;justify-content:space-between;width:130px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#caption{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;max-width:min(860px,calc(100% - 28px));text-align:center;font-weight:700;font-size:15px;text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none}
#panel{position:absolute;right:0;top:0;bottom:0;width:360px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px 24px;overflow:auto;transform:translateX(100%);transition:transform .15s}
#panel.open{transform:none}
#panel h2{margin:0 0 2px;font-size:18px;word-break:break-all}
#panel .sub{color:var(--dim);font-size:12px;word-break:break-all;margin-bottom:8px}
#panel h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 0 5px}
#x{position:absolute;right:10px;top:8px;padding:2px 9px}
.badge{display:inline-block;background:#1b2540;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:0 5px 4px 0;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv{background:#0e1422;border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.kv b{display:block;font-size:16px}.kv span{font-size:11px;color:var(--dim)}
.bar{display:flex;align-items:center;gap:7px;font-size:12px;margin:2px 0}
.bar i{display:block;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.bar .t{flex:0 0 7.5em;color:var(--dim)}.bar .n{flex:0 0 2.6em;text-align:right}
.bar .w{flex:1;background:#0e1422;border-radius:4px;height:7px}
.list a{display:inline-block;background:#0e1422;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:0 4px 4px 0;color:#cfe0ff;cursor:pointer;font-size:12px;text-decoration:none}
.list a:hover{border-color:var(--blue)}
.note{color:var(--dim);font-size:12px}
svg.sp{width:100%;height:46px;background:#0e1422;border:1px solid var(--line);border-radius:7px}
body.pan #caption{left:calc((100% - 360px)/2);max-width:calc(100% - 392px)}
@media (max-width:700px){#legend{display:none}#panel{width:100%;top:45%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Call network over time"></canvas>
<div id="top">
  <h1 id="title"></h1>
  <span id="when"></span>
  <button id="play" aria-label="Play or pause (space)">Play</button>
  <button id="prev" aria-label="Previous snapshot">&larr;</button>
  <button id="next" aria-label="Next snapshot">&rarr;</button>
  <input id="slider" type="range" min="0" value="0" aria-label="Time">
  <select id="speed" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
  <label class="tg"><input type="checkbox" id="tgRoads" checked>roads</label>
  <label class="tg"><input type="checkbox" id="tgLabels" checked>labels</label>
  <input id="q" type="search" placeholder="find a function" aria-label="Find a function">
</div>
<div id="legend">
  <div>road colour = age</div><div id="grad"></div><div><span>new</span><span>old</span></div>
  <div>road width = calls merged</div>
  <div><span class="dot" style="background:var(--lime)"></span>born &nbsp; <span class="dot" style="background:var(--amber)"></span>died</div>
  <div>click a function or file &middot; wheel to zoom</div>
</div>
<div id="caption"></div>
<aside id="panel" aria-live="polite"><button id="x" aria-label="Close">&times;</button><div id="pbody"></div></aside>
<script>
"use strict";
const D=/*__DATA__*/null;
const N=D.meta.snaps.length,F=D.files,FN=D.funcs,E=D.edges,R=D.roads,EXT=D.meta.ext;
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lerp=(a,b,t)=>a+(b-a)*t;
const RAMP=[[210,245,106],[56,214,164],[59,134,240]];
function rampColor(a){a=Math.min(1,Math.max(0,a));const x=a*2,i=Math.min(1,Math.floor(x)),t=x-i,c0=RAMP[i],c1=RAMP[i+1];return [lerp(c0[0],c1[0],t)|0,lerp(c0[1],c1[1],t)|0,lerp(c0[2],c1[2],t)|0];}

/* ---------- preprocessing ---------- */
const alive=[];for(let s=0;s<N;s++)alive.push(new Uint8Array(FN.length));
FN.forEach((f,i)=>{const rg=f[14];for(let k=0;k<rg.length;k+=2)for(let s=rg[k];s<=rg[k+1];s++)alive[s][i]=1;});
const edgesAt=[];for(let s=0;s<N;s++)edgesAt.push([]);
E.forEach((e,i)=>{const rg=e[2];for(let k=0;k<rg.length;k+=2)for(let s=rg[k];s<=rg[k+1];s++)edgesAt[s].push(i);});
const indeg=[];for(let s=0;s<N;s++){const a=new Uint16Array(FN.length);for(const ei of edgesAt[s])a[E[ei][1]]++;indeg.push(a);}
const fileCount=[];for(let s=0;s<N;s++){const a=new Uint16Array(F.length);for(let i=0;i<FN.length;i++)if(alive[s][i])a[FN[i][1]]++;fileCount.push(a);}
const roadAge=R.map(r=>{let a=0;return r.c.map(c=>(a=c?a+1:0));});
const roadPath=R.map(r=>{const p=new Path2D(),q=r.p;p.moveTo(q[0],q[1]);for(let i=2;i<q.length;i+=2)p.lineTo(q[i],q[i+1]);return p;});
const hubSet=new Set(D.hubs);
/* spatial grid over functions */
const CELL=Math.max(EXT/80,2);const grid=new Map();
FN.forEach((f,i)=>{const k=Math.floor(f[2]/CELL)+","+Math.floor(f[3]/CELL);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(i);});

/* ---------- view ---------- */
let W=0,H=0,dpr=1,view={k:1,tx:0,ty:0},T=0,playing=false,sel=null,lastTs=0;
const opts={roads:true,labels:true};
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;fit();}
function fit(){const panel=$("panel").classList.contains("open")&&W>700?360:0,aw=W-panel,ah=H-90;view.k=Math.min(aw,ah)/(2*EXT*1.04);view.tx=aw/2;view.ty=46+ah/2;draw();}
const toScreen=(x,y)=>[x*view.k+view.tx,-y*view.k+view.ty];
const toWorld=(sx,sy)=>[(sx-view.tx)/view.k,-(sy-view.ty)/view.k];
const inRg=(rg,s)=>{for(let k=0;k<rg.length;k+=2)if(s>=rg[k]&&s<=rg[k+1])return true;return false;};

/* ---------- drawing ---------- */
const LV=[.30,.42,.54,.66,.78,.9];
function draw(){
  const s=Math.min(N-1,Math.floor(T+1e-9)),t=T-s,fade=Math.max(0,1-t),prev=s?s-1:0,k=view.k;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#0b0f17";ctx.fillRect(0,0,W,H);
  ctx.setTransform(k*dpr,0,0,-k*dpr,view.tx*dpr,view.ty*dpr);
  const x0=-view.tx/k,x1=(W-view.tx)/k,y1=view.ty/k,y0=-(H-view.ty)/k;   // visible world box
  const vis=(x,y,r)=>x+r>=x0&&x-r<=x1&&y+r>=y0&&y-r<=y1;
  // file circles
  ctx.lineWidth=.9/k;ctx.strokeStyle="rgba(138,150,176,.24)";ctx.beginPath();
  for(let f=0;f<F.length;f++){if(!(fileCount[s][f]||fileCount[prev][f]))continue;const o=F[f];if(!vis(o.x,o.y,o.r))continue;ctx.moveTo(o.x+o.r,o.y);ctx.arc(o.x,o.y,o.r,0,6.2832);}
  ctx.stroke();
  // roads
  if(opts.roads){
    const live=[];for(let i=0;i<R.length;i++)if(R[i].c[s])live.push(i);
    live.sort((a,b)=>roadAge[a][s]-roadAge[b][s]);
    ctx.lineCap="round";ctx.lineJoin="round";
    for(const i of live){const r=R[i],age=roadAge[i][s],a=Math.min(age/40,1),n=r.c[s];
      let al=(.20+.30*Math.min(1,Math.sqrt(n)/4))*(1-.35*a);if(age<=1&&s>0)al=Math.min(1,al+.30*fade);
      if(sel!==null)al*=.55;
      const c=rampColor(a);ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${al})`;ctx.lineWidth=(.35+.25*Math.sqrt(n))*1.15/k;ctx.stroke(roadPath[i]);}
    if(s>0){ctx.strokeStyle=`rgba(255,176,0,${.45*fade})`;
      for(let i=0;i<R.length;i++)if(R[i].c[s-1]&&!R[i].c[s]){ctx.lineWidth=(.35+.25*Math.sqrt(R[i].c[s-1]))*1.15/k;ctx.stroke(roadPath[i]);}}
  }
  // functions
  const buckets=[[],[],[],[],[],[]],born=[],died=[];
  for(let i=0;i<FN.length;i++){const f=FN[i];if(!vis(f[2],f[3],f[4]))continue;
    const a=alive[s][i],p=s?alive[s-1][i]:a;
    if(a&&!p&&s>0)born.push(i);else if(a)buckets[Math.min(5,Math.floor(Math.log2(1+indeg[s][i])*1.3))].push(i);else if(p&&s>0)died.push(i);}
  const rad=i=>Math.max(FN[i][4]*.95,.8/k);
  const fillSet=(arr,style,grow)=>{if(!arr.length)return;ctx.fillStyle=style;ctx.beginPath();for(const i of arr){const f=FN[i],r=rad(i)*grow;ctx.moveTo(f[2]+r,f[3]);ctx.arc(f[2],f[3],r,0,6.2832);}ctx.fill();};
  buckets.forEach((b,l)=>fillSet(b,`rgba(196,205,224,${LV[l]})`,1));
  fillSet(born,`rgba(210,245,106,${.40+.55*fade})`,1+.9*fade);
  fillSet(died,`rgba(255,176,0,${.85*fade})`,1+.4*fade);
  // new folder rings
  for(let s0=Math.max(0,s-2);s0<=s;s0++){const age=(s-s0)+t;if(age>=3)continue;const fa=1-age/3;
    ctx.strokeStyle=`rgba(255,255,255,${.3+.6*fa})`;ctx.lineWidth=(1+1.6*fa)*1.2/k;ctx.beginPath();
    for(const nd of D.newdirs[s0])for(const f of nd.f){const o=F[f];ctx.moveTo(o.x+o.r+1.2,o.y);ctx.arc(o.x,o.y,o.r+1.2,0,6.2832);}ctx.stroke();}
  // selection: callers (white) and callees (blue)
  if(sel&&sel.kind==="func"){const i=sel.i,f=FN[i];ctx.lineWidth=1.3/k;
    for(const ei of edgesAt[s]){const e=E[ei];
      if(e[1]===i){const g=FN[e[0]];ctx.strokeStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.moveTo(g[2],g[3]);ctx.lineTo(f[2],f[3]);ctx.stroke();ring(e[0],"#ffffff");}
      else if(e[0]===i){const g=FN[e[1]];ctx.strokeStyle="rgba(124,192,255,.85)";ctx.beginPath();ctx.moveTo(f[2],f[3]);ctx.lineTo(g[2],g[3]);ctx.stroke();ring(e[1],"#7cc0ff");}}
    ring(i,"#ffe9a8",2.2);}
  if(sel&&sel.kind==="file"){const o=F[sel.f];ctx.strokeStyle="#ffe9a8";ctx.lineWidth=2/k;ctx.beginPath();ctx.arc(o.x,o.y,o.r+1,0,6.2832);ctx.stroke();}
  // labels (screen space)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(opts.labels){
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="11px system-ui";
    for(const d of D.dirs){let live=0;for(const f of d.f)if(fileCount[s][f])live++;if(live<4)continue;const [sx,sy]=toScreen(d.x,d.y);
      if(sx<-50||sx>W+50||sy<-20||sy>H+20)continue;halo(d.d,sx,sy,"rgba(154,166,191,.8)");}
    ctx.font="10.5px system-ui";
    for(let f=0;f<F.length;f++){const o=F[f];if(!fileCount[s][f])continue;const big=o.r*k>46;if(!(big||hubSet.has(f)&&o.r*k>9))continue;
      const [sx,sy]=toScreen(o.x,o.y-o.r);if(sx<-50||sx>W+50||sy<-20||sy>H+20)continue;halo(o.p.split("/").pop(),sx,sy+8,hubSet.has(f)?"#f6ecd2":"rgba(200,208,226,.75)");}
    if(sel&&sel.kind==="func"){const f=FN[sel.i],[sx,sy]=toScreen(f[2],f[3]);ctx.font="bold 12px system-ui";halo(f[0],sx,sy-12,"#ffe9a8");}
  }
  $("when").textContent=D.meta.snaps[s].label;
  $("caption").textContent=D.meta.caps[s];
  const sl=$("slider");if(document.activeElement!==sl)sl.value=Math.round(T*100);
}
function halo(txt,x,y,col){ctx.lineWidth=3;ctx.strokeStyle="rgba(11,15,23,.9)";ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y);}
function ring(i,col,w){const f=FN[i];ctx.strokeStyle=col;ctx.lineWidth=(w||1.4)/view.k;ctx.beginPath();const r=Math.max(f[4]*.95,.8/view.k)+3/view.k;ctx.arc(f[2],f[3],r,0,6.2832);ctx.stroke();}

/* ---------- playback ---------- */
function setT(v){T=Math.min(N-1,Math.max(0,v));draw();}
function tick(ts){if(!playing)return;const dt=lastTs?(ts-lastTs)/1000:0;lastTs=ts;
  T+=dt*1.2*parseFloat($("speed").value);if(T>=N-1){T=N-1;setPlaying(false);}draw();requestAnimationFrame(tick);}
function setPlaying(p){playing=p;$("play").textContent=p?"Pause":"Play";if(p){if(T>=N-1)T=0;lastTs=0;requestAnimationFrame(tick);}}
$("play").onclick=()=>setPlaying(!playing);
$("prev").onclick=()=>{setPlaying(false);setT(Math.ceil(T-1e-9)-1);};
$("next").onclick=()=>{setPlaying(false);setT(Math.floor(T+1e-9)+1);};
$("slider").max=(N-1)*100;
$("slider").oninput=e=>{setPlaying(false);setT(e.target.value/100);};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.target.type!=="range"&&e.target.type!=="checkbox")return;
  if(e.code==="Space"){e.preventDefault();setPlaying(!playing);}
  else if(e.key==="ArrowRight")$("next").click();else if(e.key==="ArrowLeft")$("prev").click();
  else if(e.key==="Escape")closePanel();});
$("tgRoads").onchange=e=>{opts.roads=e.target.checked;draw();};
$("tgLabels").onchange=e=>{opts.labels=e.target.checked;draw();};

/* ---------- pan / zoom / pick ---------- */
let drag=null;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};});
cv.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;cv.classList.add("drag");}
  if(drag.moved){view.tx=drag.tx+dx;view.ty=drag.ty+dy;draw();}});
cv.addEventListener("pointerup",e=>{cv.classList.remove("drag");const d=drag;drag=null;if(d&&!d.moved)pick(e.clientX,e.clientY);});
cv.addEventListener("wheel",e=>{e.preventDefault();const f=Math.exp(-e.deltaY*.0015),[wx,wy]=toWorld(e.clientX,e.clientY);view.k*=f;view.tx=e.clientX-wx*view.k;view.ty=e.clientY+wy*view.k;draw();},{passive:false});
cv.addEventListener("dblclick",()=>fit());
function pick(sx,sy){
  const s=Math.min(N-1,Math.floor(T+1e-9)),[wx,wy]=toWorld(sx,sy),cx=Math.floor(wx/CELL),cy=Math.floor(wy/CELL),reach=Math.ceil((8/view.k)/CELL)+1;
  let best=null,bd=1e18;
  for(let a=-reach;a<=reach;a++)for(let b=-reach;b<=reach;b++){const arr=grid.get((cx+a)+","+(cy+b));if(!arr)continue;
    for(const i of arr){const prevA=s?alive[s-1][i]:0;if(!alive[s][i]&&!prevA)continue;const f=FN[i],d=Math.hypot(f[2]-wx,f[3]-wy),lim=Math.max(f[4]*.95,7/view.k);if(d<lim&&d<bd){bd=d;best=i;}}}
  if(best!==null){selectFunc(best);return;}
  let bf=null,br=1e18;for(let f=0;f<F.length;f++){if(!fileCount[s][f])continue;const o=F[f];if(Math.hypot(o.x-wx,o.y-wy)<=o.r&&o.r<br){br=o.r;bf=f;}}
  if(bf!==null)selectFile(bf);else closePanel();
}

/* ---------- panel ---------- */
function openPanel(){$("panel").classList.add("open");document.body.classList.add("pan");fit();}
function closePanel(){sel=null;$("panel").classList.remove("open");document.body.classList.remove("pan");fit();}
$("x").onclick=closePanel;
const lbl=s=>D.meta.snaps[s].label;
function pretty(k){return k.replace(/^(struct|state|arch|def|threat|sec|llm|ml|dl)_/,"").replace(/_/g," ");}
function links(ids){return ids.slice(0,24).map(i=>`<a data-f="${i}">${esc(FN[i][0])}</a>`).join("")+(ids.length>24?`<span class="note"> +${ids.length-24} more</span>`:"");}
function bars(obj,max){const ks=Object.keys(obj);if(!ks.length)return '<div class="note">none recorded</div>';
  return ks.map(k=>`<div class="bar"><span class="t">${esc(pretty(k))}</span><span class="w"><i style="width:${Math.min(100,100*obj[k]/max)}%"></i></span><span class="n">${obj[k]}</span></div>`).join("");}
function selectFunc(i){setPlaying(false);sel={kind:"func",i};const f=FN[i],s=Math.min(N-1,Math.floor(T+1e-9)),fl=F[f[1]];
  const callers=[],callees=[],series=new Array(N).fill(0);
  E.forEach((e,ei)=>{const rg=e[2];if(e[1]===i){for(let k=0;k<rg.length;k+=2)for(let q=rg[k];q<=rg[k+1];q++)series[q]++;if(inRg(rg,s))callers.push(e[0]);}
    else if(e[0]===i&&inRg(rg,s))callees.push(e[1]);});
  const rg=f[14],first=rg[0],last=rg[rg.length-1],now=alive[s][i];
  const life=now?`alive now · first seen ${lbl(first)}`:(s<first?`not born yet · first seen ${lbl(first)}`:`gone · last seen ${lbl(last)}`);
  const mx=Math.max(1,...series),pts=series.map((v,q)=>`${(q/(Math.max(1,N-1)))*300},${42-(v/mx)*36}`).join(" ");
  const alv=[];for(let k=0;k<rg.length;k+=2)alv.push(`<rect x="${rg[k]/Math.max(1,N-1)*300}" y="0" width="${Math.max(2,(rg[k+1]-rg[k])/Math.max(1,N-1)*300)}" height="46" fill="rgba(56,214,164,.12)"/>`);
  const cur=`<line x1="${s/Math.max(1,N-1)*300}" x2="${s/Math.max(1,N-1)*300}" y1="0" y2="46" stroke="#ffe9a8" stroke-width="1"/>`;
  $("pbody").innerHTML=`<h2>${esc(f[0])}</h2><div class="sub">${esc(fl.p)}</div>
  <div>${f[8]?`<span class="badge">${esc(f[8])}</span>`:""}${f[10]?'<span class="badge">public</span>':""}${f[11]?'<span class="badge">documented</span>':'<span class="badge">undocumented</span>'}</div>
  <div class="note">${life}</div>
  <h3>GitGalaxy metrics <span class="note" style="text-transform:none;letter-spacing:0">(as of ${lbl(last)})</span></h3>
  <div class="grid"><div class="kv"><b>${f[5]}</b><span>lines</span></div><div class="kv"><b>${f[6]}</b><span>complexity</span></div><div class="kv"><b>${f[7]}</b><span>arguments</span></div>
  <div class="kv"><b>${f[9]}</b><span>z-score</span></div><div class="kv"><b>${callers.length}</b><span>callers now</span></div><div class="kv"><b>${callees.length}</b><span>calls now</span></div></div>
  <h3>Callers over time</h3><svg class="sp" viewBox="0 0 300 46" preserveAspectRatio="none">${alv.join("")}<polyline fill="none" stroke="#38d6a4" stroke-width="1.6" points="${pts}"/>${cur}</svg>
  <h3>Called by (${callers.length})</h3><div class="list">${callers.length?links(callers):'<span class="note">nothing in this snapshot</span>'}</div>
  <h3>Calls (${callees.length})</h3><div class="list">${callees.length?links(callees):'<span class="note">nothing in this snapshot</span>'}</div>
  <h3>Keyword signals</h3>${bars(f[13],Math.max(1,...Object.values(f[13]),1))}
  <h3>File</h3><div class="sub" style="margin:0 0 4px">${esc(fl.p)} · ${esc(fl.lang||"")} · ${fl.loc} lines${fl.arch?` · ${esc(fl.arch)}`:""}</div>
  ${Object.keys(fl.risk).length?bars(fl.risk,100):""}<div class="note" style="margin-top:6px">File risk scores are GitGalaxy's, 0 to 100.</div>
  <div class="note" style="margin-top:10px"><a href="#" id="lnk" style="color:#cfe0ff">copy link to this function</a></div>`;
  $("pbody").querySelectorAll("[data-f]").forEach(a=>a.onclick=()=>selectFunc(+a.dataset.f));
  $("lnk").onclick=ev=>{ev.preventDefault();location.hash=`t=${T.toFixed(2)}&f=${i}`;navigator.clipboard&&navigator.clipboard.writeText(location.href);};
  openPanel();draw();}
function selectFile(f){setPlaying(false);sel={kind:"file",f};const o=F[f],s=Math.min(N-1,Math.floor(T+1e-9));
  const ids=[];FN.forEach((g,i)=>{if(g[1]===f&&alive[s][i])ids.push(i);});ids.sort((a,b)=>FN[b][5]-FN[a][5]);
  $("pbody").innerHTML=`<h2>${esc(o.p.split("/").pop())}</h2><div class="sub">${esc(o.p)}</div>
  <div>${o.lang?`<span class="badge">${esc(o.lang)}</span>`:""}${o.arch?`<span class="badge">${esc(o.arch)}</span>`:""}</div>
  <div class="grid"><div class="kv"><b>${o.loc}</b><span>lines</span></div><div class="kv"><b>${ids.length}</b><span>functions now</span></div></div>
  <h3>Largest functions now</h3><div class="list">${ids.length?links(ids):'<span class="note">none in this snapshot</span>'}</div>
  <h3>GitGalaxy risk (0 to 100)</h3>${Object.keys(o.risk).length?bars(o.risk,100):'<div class="note">not recorded</div>'}`;
  $("pbody").querySelectorAll("[data-f]").forEach(a=>a.onclick=()=>selectFunc(+a.dataset.f));openPanel();draw();}
$("q").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const q=e.target.value.trim().toLowerCase();if(!q)return;const s=Math.floor(T+1e-9);
  let hit=-1;for(let i=0;i<FN.length&&hit<0;i++)if(alive[s][i]&&FN[i][0].toLowerCase().includes(q))hit=i;
  if(hit<0)for(let i=0;i<FN.length&&hit<0;i++)if(FN[i][0].toLowerCase().includes(q))hit=i;
  if(hit<0){e.target.style.borderColor="#ffb000";return;}e.target.style.borderColor="";
  if(!alive[s][hit])T=FN[hit][14][0];selectFunc(hit);
  const f=FN[hit];view.tx=(W-($("panel").classList.contains("open")&&W>700?360:0))/2-f[2]*view.k;view.ty=H/2+f[3]*view.k;draw();});

/* ---------- boot ---------- */
$("title").textContent=D.meta.title;
window.addEventListener("resize",resize);resize();
(function(){const h=new URLSearchParams(location.hash.slice(1));if(h.has("t"))T=Math.min(N-1,Math.max(0,parseFloat(h.get("t"))||0));
  draw();if(h.has("f")&&FN[+h.get("f")])selectFunc(+h.get("f"));})();
</script>
</body>
</html>
