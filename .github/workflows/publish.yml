name: publish to PyPI

# Publishes with PyPI "trusted publishing" (OpenID Connect): no API token is stored anywhere.
# One-time setup on PyPI: project -> Settings -> Publishing -> add a GitHub publisher with
#   owner squid-protocol, repository historical-call-graph-gif, workflow publish.yml, environment pypi.
# Release: bump the version in pyproject.toml and the package __init__, commit, then `git tag vX.Y.Z && git push --tags`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install build twine -e ".[dev]"
      - name: Test
        run: python -m pytest -q tests
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import historical_call_graph_gif as m; print(m.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build
        run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/historical-call-graph-gif
    permissions:
      id-token: write            # lets this job prove its identity to PyPI
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
